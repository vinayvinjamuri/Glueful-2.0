<!DOCTYPE html>
<html lang="en">
<head>

  <script src="./glueful-client-bootstrap-v1.js?v=151"></script>

  <!-- =====================================================
       SUPABASE
  ====================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://xztbhheexianejsvwpva.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_91SKh77UlMjhwIcTimKyAg_Nbb_uVIN";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );

    /*
     * SUPABASE JOB LISTINGS CONNECTION TEST
     * -------------------------------------
     * Verifies that the frontend can read public.job_listings through
     * the Supabase Data API using the existing publishable key.
     *
     * Only one row is requested so this test never downloads the
     * entire job_listings table.
     *
     * The function is also exposed on window so it can be re-run from
     * DevTools Console with:
     *
     *   testGluefulJobListings()
     */
    async function testGluefulJobListings() {
      try {
        const { data, error } = await supabaseClient
          .from("job_listings")
          .select("*, job_intelligence(*)")
          .limit(1);

        if (error) {
          console.error(
            "[Glueful] job_listings Supabase test FAILED:",
            error
          );

          return {
            ok: false,
            error
          };
        }

        console.log(
          "[Glueful] job_listings Supabase test OK:",
          {
            rowsReturned: Array.isArray(data) ? data.length : 0,
            sample: Array.isArray(data) && data.length ? data[0] : null
          }
        );

        return {
          ok: true,
          data: data || []
        };
      } catch (error) {
        console.error(
          "[Glueful] job_listings Supabase test FAILED:",
          error
        );

        return {
          ok: false,
          error
        };
      }
    }

    window.testGluefulJobListings = testGluefulJobListings;
  </script>
