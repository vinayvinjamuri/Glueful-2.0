name: Resume Studio fixed-page prototype regression
on:
  push:
    branches: ['feature/resume-studio-canonical-v2-safe']
  pull_request:
    branches: ['main']
    paths:
      - 'glueful-resume-layout-model.js'
      - 'glueful-resume-pdf-layout-importer.js'
      - 'glueful-resume-fixed-page-renderer.js'
      - 'glueful-resume-fixed-page-controller.js'
      - 'glueful-resume-fixed-page-bootstrap.js'
      - '.github/workflows/resume-fixed-page-prototype.yml'
permissions:
  contents: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          set -e
          for f in \
            glueful-resume-layout-model.js \
            glueful-resume-pdf-layout-importer.js \
            glueful-resume-fixed-page-renderer.js \
            glueful-resume-fixed-page-controller.js \
            glueful-resume-fixed-page-bootstrap.js; do
            node --check "$f"
          done
      - name: Architecture invariants
        run: |
          node <<'NODE'
          const fs=require('fs');
          const checks={
            'glueful-resume-layout-model.js':['glueful-resume-layout-document','createMask','maskWidth','maskHeight','sourceItems'],
            'glueful-resume-pdf-layout-importer.js':['pdf-fixed-page-v2','original-pdf','PT_TO_PX','createMask','maskForLine'],
            'glueful-resume-fixed-page-renderer.js':['glueful-fixed-page','glueful-fixed-mask','glueful-fixed-text','fixed-page-pdf-v2'],
            'glueful-resume-fixed-page-controller.js':['gluefulFixedPdfResumeStudio','resumeRenderer','fixed-pdf','renderPdf','printPdf'],
            'glueful-resume-fixed-page-bootstrap.js':['glueful-resume-fixed-page-controller.js','resumeRenderer']
          };
          for(const [file,needles] of Object.entries(checks)){
            const text=fs.readFileSync(file,'utf8');
            for(const n of needles) if(!text.includes(n)) throw new Error(`${file} missing ${n}`);
          }
          const sw=fs.readFileSync('sw.js','utf8');
          for(const name of ['glueful-resume-layout-model.js','glueful-resume-pdf-layout-importer.js','glueful-resume-fixed-page-renderer.js','glueful-resume-fixed-page-controller.js','glueful-resume-fixed-page-bootstrap.js']){
            if(sw.includes(name)) throw new Error(`Prototype must not be production-injected: ${name}`);
          }
          console.log('Fixed-page prototype isolation and model contracts passed');
          NODE