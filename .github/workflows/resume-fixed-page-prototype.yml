name: Resume Studio fixed-page regression
on:
  push:
    branches: ['fix/resume-pdf-visual-editing']
  pull_request:
    branches: ['main']
    paths:
      - 'sw.js'
      - 'glueful-resume-layout-model.js'
      - 'glueful-resume-pdf-layout-importer.js'
      - 'glueful-resume-fixed-page-renderer.js'
      - 'glueful-resume-fixed-page-controller.js'
      - 'glueful-resume-fixed-page-bootstrap.js'
      - 'glueful-resume-studio-v41-bootstrap.js'
      - '.github/workflows/resume-fixed-page-prototype.yml'
permissions:
  contents: read
jobs:
  fixed-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax checks
        run: |
          set -e
          for f in sw.js glueful-resume-layout-model.js glueful-resume-pdf-layout-importer.js glueful-resume-fixed-page-renderer.js glueful-resume-fixed-page-controller.js glueful-resume-fixed-page-bootstrap.js glueful-resume-studio-v41-bootstrap.js; do
            node --check "$f"
          done
      - name: Fixed-page visual-first invariants
        run: |
          node <<'NODE'
          const fs=require('fs');
          const checks={
            'glueful-resume-layout-model.js':['glueful-resume-layout-document','createMask','maskWidth','maskHeight','sourceItems'],
            'glueful-resume-pdf-layout-importer.js':['pdf-fixed-page-v2','original-pdf','PT_TO_PX','createMask','maskForLine'],
            'glueful-resume-fixed-page-renderer.js':['glueful-fixed-page-v4','glueful-fixed-mask','glueful-fixed-text','safeBlockWidth','overflow-wrap:break-word','caret-color:#202124','visibility:hidden','glueful-fixed-editing'],
            'glueful-resume-fixed-page-controller.js':['gluefulFixedPdfResumeStudio','fitToViewport','fixed-page-pdf-v5','viewportWidth','fixedPdfViewportWidth','surface.style.transform','orientationchange'],
            'glueful-resume-fixed-page-bootstrap.js':['glueful-resume-fixed-page-controller.js','20260819-fixedpdf6','__gluefulFixedPdfScheduled'],
            'glueful-resume-studio-v41-bootstrap.js':['fixedPdfScheduled','fixed-PDF runtime owns Resume Studio','if(fixedPdfScheduled()) return'],
            'sw.js':['glueful-cache-v19-resume-fixed-pdf-authority','20260819-fixedpdf6','FIXED_PDF_BOOTSTRAP','FIXED_PDF_MODEL','FIXED_PDF_IMPORTER','FIXED_PDF_RENDERER','FIXED_PDF_CONTROLLER']
          };
          for(const [file,needles] of Object.entries(checks)){
            const text=fs.readFileSync(file,'utf8');
            for(const n of needles) if(!text.includes(n)) throw new Error(`${file} missing ${n}`);
          }
          const renderer=fs.readFileSync('glueful-resume-fixed-page-renderer.js','utf8');
          if(renderer.includes('color:#202124;overflow:hidden;white-space:pre-wrap')) throw new Error('Renderer reverted to always-visible browser text');
          const controller=fs.readFileSync('glueful-resume-fixed-page-controller.js','utf8');
          if(!controller.includes('surface.style.transform=`scale')) throw new Error('Fixed page is not scaled as a whole surface');
          console.log('Fixed-page visual-first and viewport contracts passed');
          NODE