name: Jobs Mobile UX Regression

on:
  push:
    paths:
      - 'glueful-jobs-mobile-ux-v15.js'
      - 'glueful-jobs-mobile-card-polish-v1.js'
      - 'glueful-jobs-smooth-logos-v1.js'
      - '.github/workflows/jobs-mobile-ux-regression.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'glueful-jobs-mobile-ux-v15.js'
      - 'glueful-jobs-mobile-card-polish-v1.js'
      - 'glueful-jobs-smooth-logos-v1.js'
      - 'sw.js'
      - '.github/workflows/jobs-mobile-ux-regression.yml'

permissions:
  contents: read

jobs:
  mobile-ux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript syntax
        run: |
          set -e
          node --check glueful-jobs-mobile-ux-v15.js
          node --check glueful-jobs-mobile-card-polish-v1.js
          node --check glueful-jobs-smooth-logos-v1.js
      - name: Native swipeable Jobs and Companies contracts
        run: |
          set -e
          grep -q 'g15-mobile-swipe-rail' glueful-jobs-mobile-ux-v15.js
          grep -q 'g15-mobile-dots' glueful-jobs-mobile-ux-v15.js
          grep -q 'Swipe to explore relevant jobs' glueful-jobs-mobile-ux-v15.js
          grep -q 'Swipe to explore companies' glueful-jobs-mobile-ux-v15.js
          grep -q 'scroll-snap-type:x proximity' glueful-jobs-mobile-ux-v15.js
          grep -q 'touch-action:pan-x pan-y' glueful-jobs-mobile-ux-v15.js
          grep -q 'overflow-x:auto' glueful-jobs-mobile-ux-v15.js
          grep -q 'g15-rail' glueful-jobs-mobile-ux-v15.js
          grep -q 'g15-company-rail' glueful-jobs-mobile-ux-v15.js
          grep -q 'glueful-jobs-mobile-ux-v15.js' glueful-jobs-mobile-card-polish-v1.js
          ! grep -Eq "addEventListener\\(['\"]touchmove" glueful-jobs-mobile-ux-v15.js
          ! grep -Eq 'preventDefault[[:space:]]*\\(' glueful-jobs-mobile-ux-v15.js
      - name: BrandFetch and latest-company-jobs contract
        run: |
          set -e
          grep -q '__GLUEFUL_JOBS_SMOOTH_LOGOS_V4__' glueful-jobs-smooth-logos-v1.js
          grep -q 'cdn.brandfetch.io' glueful-jobs-smooth-logos-v1.js
          grep -q 'g15-company' glueful-jobs-smooth-logos-v1.js
          grep -q 'dataset.company' glueful-jobs-smooth-logos-v1.js
          grep -q 'gluefulJobsV15?.getJobs' glueful-jobs-smooth-logos-v1.js
          grep -q 'MutationObserver' glueful-jobs-smooth-logos-v1.js
          grep -q "document.getElementById('glueful-jobs-v15')" glueful-jobs-smooth-logos-v1.js
          grep -q 'g15-latest-company-jobs' glueful-jobs-smooth-logos-v1.js
          grep -q 'Latest jobs from top companies' glueful-jobs-smooth-logos-v1.js
          grep -q 'Swipe horizontally to explore more opportunities' glueful-jobs-smooth-logos-v1.js
          grep -q 'uniqueCompanyJobs' glueful-jobs-smooth-logos-v1.js
          grep -q 'g15-latest-rail' glueful-jobs-smooth-logos-v1.js
          grep -q 'g15-latest-logo' glueful-jobs-smooth-logos-v1.js
          grep -q 'company_logo_url||brandLogo' glueful-jobs-smooth-logos-v1.js
          ! grep -Eq "addEventListener\\(['\"]touchmove" glueful-jobs-smooth-logos-v1.js
          ! grep -Eq 'preventDefault[[:space:]]*\\(' glueful-jobs-smooth-logos-v1.js
      - name: Existing V15 card polish preserved
        run: |
          set -e
          grep -q 'height:214px' glueful-jobs-mobile-card-polish-v1.js
          grep -q 'Webkit-line-clamp' glueful-jobs-mobile-card-polish-v1.js || grep -q -- '-webkit-line-clamp:2' glueful-jobs-mobile-card-polish-v1.js
          grep -q 'g15LogoFallback' glueful-jobs-mobile-card-polish-v1.js
