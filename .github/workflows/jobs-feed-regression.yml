name: Jobs Discover Regression
on:
  push:
    paths:
      - 'glueful-jobs-discover-v3.js'
      - 'glueful-jobs-discover-v4.js'
      - 'glueful-jobs-discover-v5.js'
      - 'glueful-jobs-discover-v6.js'
      - 'sw.js'
      - '.github/workflows/jobs-feed-regression.yml'
  pull_request:
    paths:
      - 'glueful-jobs-discover-v3.js'
      - 'glueful-jobs-discover-v4.js'
      - 'glueful-jobs-discover-v5.js'
      - 'glueful-jobs-discover-v6.js'
      - 'sw.js'
jobs:
  syntax-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript syntax
        run: |
          node --check glueful-jobs-discover-v3.js
          node --check glueful-jobs-discover-v4.js
          node --check glueful-jobs-discover-v5.js
          node --check glueful-jobs-discover-v6.js
          node --check sw.js
      - name: Jobs feed contract checks
        run: |
          grep -q "get-personalized-jobs" glueful-jobs-discover-v6.js
          grep -q "Roles you've applied to" glueful-jobs-discover-v6.js
          grep -q "Curated for you" glueful-jobs-discover-v6.js
          grep -q "Top companies hiring" glueful-jobs-discover-v6.js
          grep -q "Saved for later" glueful-jobs-discover-v6.js
          grep -q "Recently seen" glueful-jobs-discover-v6.js
          grep -q "JOBS_DISCOVER_V6" sw.js
          grep -q "glueful-cache-v46-jobs-discover-v6" sw.js
          if grep -q "add(JOBS_DISCOVER_V4" sw.js; then exit 1; fi
          if grep -q "add(JOBS_DISCOVER_V5" sw.js; then exit 1; fi
