name: Jobs Discover Regression
on:
  push:
    paths:
      - 'glueful-jobs-discover-v3.js'
      - 'glueful-jobs-discover-v4.js'
      - 'glueful-jobs-discover-v5.js'
      - 'glueful-jobs-discover-v6.js'
      - 'glueful-jobs-discover-v6-hotfix.js'
      - 'glueful-jobs-discover-v7.js'
      - 'glueful-jobs-logo-patch-v1.js'
      - 'sw.js'
      - '.github/workflows/jobs-feed-regression.yml'
  pull_request:
    paths:
      - 'glueful-jobs-discover-v3.js'
      - 'glueful-jobs-discover-v4.js'
      - 'glueful-jobs-discover-v5.js'
      - 'glueful-jobs-discover-v6.js'
      - 'glueful-jobs-discover-v6-hotfix.js'
      - 'glueful-jobs-discover-v7.js'
      - 'glueful-jobs-logo-patch-v1.js'
      - 'sw.js'
      - '.github/workflows/jobs-feed-regression.yml'
jobs:
  syntax-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript syntax
        run: |
          node --check glueful-jobs-discover-v3.js
          node --check glueful-jobs-discover-v4.js
          node --check glueful-jobs-discover-v5.js
          node --check glueful-jobs-discover-v6.js
          node --check glueful-jobs-discover-v6-hotfix.js
          node --check glueful-jobs-discover-v7.js
          node --check glueful-jobs-logo-patch-v1.js
          node --check sw.js
      - name: Jobs feed contract checks
        run: |
          grep -q "get-personalized-jobs" glueful-jobs-discover-v7.js
          grep -q "Curated for you" glueful-jobs-discover-v7.js
          grep -q "Top companies hiring" glueful-jobs-discover-v7.js
          grep -q "openId" glueful-jobs-discover-v7.js
          grep -q "g7-row" glueful-jobs-discover-v7.js
          grep -q "company_logo_url" glueful-jobs-discover-v7.js
          grep -q "JOBS_V7" sw.js
          grep -q "glueful-cache-v49-jobs-discover-v7" sw.js
          if grep -q 'add(JOBS_V6' sw.js; then exit 1; fi
