name: Resume Studio regression

on:
  push:
    branches: [main, 'fix/**', 'feature/resume-studio-canonical-v2-safe']
  pull_request:
    paths:
      - 'glueful-resume-studio-adobe.js'
      - 'glueful-resume-docx-forensics.js'
      - 'glueful-resume-render-diagnostics.js'
      - 'glueful-resume-fixed-page-bootstrap.js'
      - 'glueful-resume-fixed-page-controller.js'
      - 'glueful-resume-fixed-page-renderer.js'
      - 'glueful-resume-layout-model.js'
      - 'glueful-resume-pdf-layout-importer.js'
      - 'glueful-resume-import-guard-v1.js'
      - 'sw.js'
      - '.github/workflows/resume-studio-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript syntax regression
        run: |
          set -e
          for f in \
            glueful-resume-studio-adobe.js \
            glueful-resume-docx-forensics.js \
            glueful-resume-render-diagnostics.js \
            glueful-resume-fixed-page-bootstrap.js \
            glueful-resume-fixed-page-controller.js \
            glueful-resume-fixed-page-renderer.js \
            glueful-resume-layout-model.js \
            glueful-resume-pdf-layout-importer.js \
            glueful-resume-import-guard-v1.js \
            sw.js; do
            node --check "$f"
          done

      - name: Fixed-page authority and visual-source regression
        run: |
          set -e
          grep -F '__gluefulFixedPdfScheduled = true' glueful-resume-fixed-page-bootstrap.js
          grep -F 'fixed-controller-v11' glueful-resume-fixed-page-controller.js
          grep -F 'original-pdf' glueful-resume-pdf-layout-importer.js
          grep -F 'explicitLogoExtraction' glueful-resume-pdf-layout-importer.js
          grep -F 'glueful-fixed-bg' glueful-resume-fixed-page-renderer.js
          grep -F 'glueful-fixed-text' glueful-resume-fixed-page-renderer.js
          grep -F 'FIXED_PDF_BOOTSTRAP' sw.js
          grep -F 'RESUME_IMPORT_GUARD' sw.js
          ! grep -F 'HEADER_FIDELITY_SCRIPT' sw.js
          ! grep -F 'HEADER_ALIGNMENT_SCRIPT' sw.js
          ! grep -F 'MOBILE_LAYOUT_SCRIPT' sw.js

      - name: PDF controller must await the cloud/device resume
        run: |
          set -e
          grep -F 'async function getFile' glueful-resume-fixed-page-controller.js
          grep -F 'await window.ensureCandidateResumeCloudFile()' glueful-resume-fixed-page-controller.js
          ! grep -F 'function getFile(){try{if(typeof candidateResumeFile' glueful-resume-fixed-page-controller.js

      - name: Fixed PDF must not be handed back to the legacy enhancer
        run: |
          set -e
          ! grep -F 'gluefulResumeStudioEnhance' glueful-resume-fixed-page-controller.js

      - name: Resume import controls remain bound
        run: |
          set -e
          grep -F 'cp-resume-file' glueful-resume-import-guard-v1.js
          grep -F 'handleCandidateResumeUpload' glueful-resume-import-guard-v1.js
          grep -F 'glueful-resume-import-guard-v1.js' glueful-resume-fixed-page-bootstrap.js

      - name: DOCX fallback remains available
        run: |
          set -e
          grep -F 'glueful-pdf-to-docx' glueful-resume-studio-adobe.js
          grep -F 'docx-preview' glueful-resume-studio-adobe.js