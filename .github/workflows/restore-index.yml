name: Restore index and load universal dashboard

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore-index:
    if: github.event.head_commit.message != 'Restore index and load universal dashboard [skip ci]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore known-good index
        run: git restore --source=08a6424c4ac7fdc6d32db5c72558d33a1622bdf5 -- index.html

      - name: Load universal dashboard directly
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '  <script src="./glueful-universal-dashboard-v1.js?v=2"></script>\n'
          if tag not in s:
              s = s.replace('<head>\n', '<head>\n\n' + tag, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit restored index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Restore index and load universal dashboard [skip ci]'
          git push
