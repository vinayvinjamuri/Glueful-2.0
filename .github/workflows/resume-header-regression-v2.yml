name: Resume Studio header regression v3

on:
  push:
    branches: [fix/resume-studio-header-visual-regression-v2, 'fix/resume-word-margins-logo-v3', 'fix/resume-fixed-page-authority', 'feature/resume-studio-canonical-v2-safe']
  pull_request:
    paths:
      - 'glueful-resume-*.js'
      - 'glueful-resume-studio-v41-bootstrap.js'
      - 'sw.js'
      - '.github/workflows/resume-header-regression-v2.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          set -e
          node --check glueful-resume-header-fidelity-v2.js
          node --check glueful-resume-header-fidelity-v3.js
          node --check glueful-resume-header-fidelity.js
          node --check glueful-resume-header-alignment.js
          node --check glueful-resume-fixed-page-bootstrap.js
          node --check glueful-resume-fixed-page-controller.js
          node --check glueful-resume-fixed-page-renderer.js
          node --check glueful-resume-studio-v41-bootstrap.js
          node --check glueful-resume-studio-adobe.js
          node --check sw.js
      - name: Validate Word geometry, logo, and fixed-page authority invariants
        run: |
          set -e
          grep -q "PAGE_WIDTH=794" glueful-resume-header-fidelity-v3.js
          grep -q "PAGE_HEIGHT=1123" glueful-resume-header-fidelity-v3.js
          grep -q "v:shape" glueful-resume-header-fidelity-v3.js
          grep -q "v:imagedata" glueful-resume-header-fidelity-v3.js
          grep -q "relPath(part)" glueful-resume-header-fidelity-v3.js
          grep -q "HEADER_FIDELITY_V3_SCRIPT" sw.js
          grep -q "20260819-4" sw.js
          grep -q "glueful-cache-v19-resume-fixed-pdf-authority" sw.js
          grep -q "__gluefulFixedPdfScheduled = true" glueful-resume-fixed-page-bootstrap.js
          grep -q "fixedPdfScheduled" glueful-resume-studio-v41-bootstrap.js
      - name: Ensure Adobe DOCX pipeline remains available
        run: |
          set -e
          ! grep -R "PDF.js.*docx.js\|docx.js.*Mammoth" glueful-resume-studio-adobe.js
          grep -q "glueful-pdf-to-docx" glueful-resume-studio-adobe.js
          grep -q "docx-preview" glueful-resume-studio-adobe.js