name: Resume Studio fixed-page regression

on:
  push:
    branches: [main, 'fix/resume-fixed-page-*']
  pull_request:
    paths:
      - 'glueful-resume-*.js'
      - 'sw.js'
      - '.github/workflows/resume-header-regression-v2.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate active Resume Studio JavaScript
        run: |
          set -e
          node --check glueful-resume-fixed-page-bootstrap.js
          node --check glueful-resume-fixed-page-controller.js
          node --check glueful-resume-fixed-page-renderer.js
          node --check glueful-resume-layout-model.js
          node --check glueful-resume-pdf-layout-importer.js
          node --check glueful-resume-studio-adobe.js
          node --check glueful-resume-docx-forensics.js
          node --check glueful-resume-render-diagnostics.js
          node --check glueful-resume-vector-docx-export-v2.js
          node --check sw.js
      - name: Validate fixed-page visual authority
        run: |
          set -e
          grep -q "window.__gluefulFixedPdfScheduled=true" glueful-resume-fixed-page-bootstrap.js
          grep -q "original-pdf" glueful-resume-pdf-layout-importer.js
          grep -q "explicitLogoExtraction" glueful-resume-pdf-layout-importer.js
          grep -q "glueful-fixed-bg" glueful-resume-fixed-page-renderer.js
          grep -q "glueful-fixed-text" glueful-resume-fixed-page-renderer.js
          ! grep -q "glueful-resume-header-fidelity.js" glueful-resume-render-diagnostics.js
      - name: Ensure Adobe DOCX pipeline remains available for non-fixed fallback
        run: |
          set -e
          grep -q "glueful-pdf-to-docx" glueful-resume-studio-adobe.js
          grep -q "docx-preview" glueful-resume-studio-adobe.js