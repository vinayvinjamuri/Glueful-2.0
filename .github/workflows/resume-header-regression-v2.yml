name: Resume Studio header regression v3
on:
  push:
    branches: [fix/resume-studio-header-visual-regression-v2, 'fix/resume-word-margins-logo-v3', 'feature/resume-studio-canonical-renderer']
  pull_request:
    paths:
      - 'glueful-resume-*.js'
      - 'glueful-resume-studio-v41-bootstrap.js'
      - 'sw.js'
      - '.github/workflows/resume-header-regression-v2.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical runtime syntax
        run: |
          set -e
          node --check glueful-resume-canonical-model.js
          node --check glueful-resume-docx-importer-v2.js
          node --check glueful-resume-canonical-renderer-v2.js
          node --check glueful-resume-canonical-editing.js
          node --check glueful-resume-canonical-export.js
          node --check glueful-resume-studio-canonical-bootstrap.js
          node --check glueful-resume-studio-canonical-controller.js
          node --check sw.js
      - name: Validate Word page and image model invariants
        run: |
          set -e
          grep -q "widthPt" glueful-resume-canonical-model.js
          grep -q "heightPt" glueful-resume-canonical-model.js
          grep -q "xPt" glueful-resume-canonical-model.js
          grep -q "horizontalReference" glueful-resume-canonical-model.js
          grep -q "glueful-canonical-floating-image" glueful-resume-canonical-renderer-v2.js
          grep -q "glueful-canonical-table" glueful-resume-canonical-renderer-v2.js
          grep -q "glueful-resume-canonical-renderer-v2.js" sw.js
      - name: Ensure canonical renderer is authoritative
        run: |
          set -e
          ! grep -F "renderAsync" glueful-resume-studio-canonical-controller.js
          ! grep -F "docx-preview" glueful-resume-studio-canonical-controller.js
          grep -q "glueful-pdf-to-docx" glueful-resume-studio-canonical-controller.js
          ! grep -q "glueful-resume-header-fidelity-v3.js" sw.js
