name: Force fresh bootstrap asset

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump-bootstrap-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump bootstrap query in index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'(\./glueful-client-bootstrap-v1\.js\?v=)(\d+)'
          m = re.search(pattern, s)
          if not m:
              raise SystemExit('Bootstrap script reference was not found')
          current = int(m.group(2))
          new = current + 1
          s = s[:m.start()] + m.group(1) + str(new) + s[m.end():]
          p.write_text(s, encoding='utf-8')
          print(f'Bumped bootstrap query v{current} -> v{new}')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index change needed.'
            exit 0
          fi
          git commit -m 'Bump bootstrap asset cache version'
          git push
