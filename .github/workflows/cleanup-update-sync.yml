name: One-time Glueful update sync cleanup

on:
  push:
    paths:
      - '.github/workflows/cleanup-update-sync.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove accidental universal layout override
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('  <script src="./glueful-universal-dashboard-v1.js?v=2"></script>\n\n', '')
          p.write_text(s)
          PY
          rm -f glueful-universal-dashboard-v1.js
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html glueful-universal-dashboard-v1.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove accidental universal layout override [skip ci]"
          git push
