name: Deploy Glueful to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Inject mobile UI cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          tag = '<script src="./glueful-mobile-cleanup-v1.js?v=20260829-logo-fix-v2"></script>'
          # Replace the previous cache-busted cleanup tag if present.
          import re
          html = re.sub(r'<script src="\./glueful-mobile-cleanup-v1\.js\?v=[^"]+"></script>\s*', '', html)
          marker = '</body>'
          if marker not in html:
              raise SystemExit('index.html has no </body> marker')
          html = html.replace(marker, tag + '\n' + marker, 1)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
