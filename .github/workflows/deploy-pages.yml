name: Deploy Glueful to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject mobile UI cleanup before app startup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          tag = '<script src="./glueful-mobile-cleanup-v1.js?v=20260829-logo-fix-v4"></script>'
          html = re.sub(r'<script src="\./glueful-mobile-cleanup-v1\.js\?v=[^"]+"></script>\s*', '', html)
          marker = '</head>'
          if marker not in html:
              raise SystemExit('index.html has no </head> marker')
          html = html.replace(marker, tag + '\n' + marker, 1)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Inject Gmail mobile application capture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          tag = '<script src="./glueful-gmail-integration-v1.js?v=20260829-gmail-v4"></script>'
          html = re.sub(r'<script src="\./glueful-gmail-integration-v1\.js\?v=[^"]+"></script>\s*', '', html)
          marker = '</head>'
          if marker not in html:
              raise SystemExit('index.html has no </head> marker')
          html = html.replace(marker, tag + '\n' + marker, 1)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Inject Gmail click bridge
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          tag = '''<script data-glueful-gmail-bridge="v4">
          (function(){
            function handle(e){
              var node=e.target instanceof Element ? e.target : e.target && e.target.parentElement;
              while(node && node !== document.body){
                var text=(node.textContent||'').replace(/\\s+/g,' ').trim().toLowerCase();
                if(text.indexOf('gmail integration')!==-1 && text.length<=320){
                  var clickable=node.matches('button,a,[role="button"],[onclick],.settings-item,.profile-row') || typeof node.onclick==='function' || node.tabIndex>=0;
                  if(clickable){
                    e.preventDefault();
                    e.stopPropagation();
                    if(typeof e.stopImmediatePropagation==='function') e.stopImmediatePropagation();
                    if(typeof window.openGmailIntegration==='function') window.openGmailIntegration();
                    return;
                  }
                }
                node=node.parentElement;
              }
            }
            document.addEventListener('click',handle,true);
            document.addEventListener('pointerdown',handle,true);
          })();
          </script>'''
          html = re.sub(r'<script data-glueful-gmail-bridge="[^"]+">[\s\S]*?</script>\s*', '', html, count=1)
          marker = '</head>'
          if marker not in html:
              raise SystemExit('index.html has no </head> marker')
          html = html.replace(marker, tag + '\n' + marker, 1)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
