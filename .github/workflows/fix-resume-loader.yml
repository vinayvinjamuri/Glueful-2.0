name: One-time Resume Studio loader fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject-loader:
    if: ${{ !contains(github.event.head_commit.message, '[resume-loader-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject authoritative Resume Studio scripts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          marker = '<script src="./glueful-resume-studio-adobe.js?v=20260819-1"></script>'
          if marker in text:
              print('Authoritative Resume Studio scripts already present.')
              raise SystemExit(0)

          anchor = '<script id="glueful-v49-splash-stability">'
          if anchor not in text:
              raise SystemExit('Could not find stable insertion anchor in index.html')

          block = '''<!-- GLUEFUL RESUME STUDIO: authoritative runtime must load AFTER legacy V50/V49 code. -->
          <script src="./glueful-resume-docx-forensics.js?v=20260819-1"></script>
          <script src="./glueful-resume-studio-adobe.js?v=20260819-1"></script>
          <script>
          console.info('[Glueful Resume Studio] authoritative Adobe controller bootstrapped from index.html:', window.gluefulAdobeResumeStudio?.version || 'missing');
          </script>
          '''

          text = text.replace(anchor, block + '\n' + anchor, 1)
          path.write_text(text, encoding='utf-8')
          print('Injected authoritative Resume Studio scripts.')
          PY

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-resume-loader.yml
          git commit -m 'fix: load authoritative Resume Studio controller [resume-loader-fixed]'
          git rm .github/workflows/fix-resume-loader.yml
          git commit -m 'chore: remove one-time Resume Studio loader workflow [resume-loader-fixed]'
          git push
