name: One shot Resumes cache bump
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          m=re.search(r'glueful-client-bootstrap-v1\.js\?v=(\d+)',s)
          if not m: raise SystemExit('bootstrap reference not found')
          n=int(m.group(1))+1
          p.write_text(s[:m.start(1)]+str(n)+s[m.end(1):],encoding='utf-8')
          PY
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Bump bootstrap cache for Resumes authority' || exit 0
          git push
