name: Inject Glueful client bootstrap

on:
  push:
    branches: [main]
    paths:
      - 'glueful-client-bootstrap-v1.js'
      - '.github/workflows/inject-client-bootstrap.yml'

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject bootstrap into index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="./glueful-client-bootstrap-v1.js?v=149"></script>'
          if tag not in text:
              marker = '<head>'
              if marker not in text:
                  raise SystemExit('index.html does not contain <head>')
              text = text.replace(marker, marker + '\n\n  ' + tag, 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Commit bootstrap injection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Load Glueful client bootstrap directly from index [skip ci]'
          git push
