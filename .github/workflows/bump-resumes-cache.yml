name: Bump Resumes cache
on:
  workflow_dispatch:
jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump bootstrap query
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='./glueful-client-bootstrap-v1.js?v=154'
          new='./glueful-client-bootstrap-v1.js?v=155'
          if old not in s:
              raise SystemExit('Expected bootstrap cache marker not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Bump bootstrap cache to v155'
          git push