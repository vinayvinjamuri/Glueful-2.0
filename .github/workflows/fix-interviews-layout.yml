name: Fix Interviews reference layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch Interviews shell CSS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('glueful-interviews-authoritative-v1.js')
          s = p.read_text(encoding='utf-8')
          marker = "html,body{overflow-x:hidden!important}"
          patch = r'''html,body{overflow-x:hidden!important}
          @media(min-width:1280px){
           body #${VIEW} .${UI}-hero,
           body #${VIEW} .${UI}-toolbar,
           body #${VIEW} .${UI}-empty{
             width:100%!important;
             max-width:none!important;
             min-width:0!important;
             margin-left:0!important;
             margin-right:0!important;
             float:none!important;
             clear:both!important;
             box-sizing:border-box!important;
           }
           body #${VIEW} .${UI}-hero{display:block!important;visibility:visible!important;}
           body #${VIEW} .${UI}-toolbar{display:flex!important;visibility:visible!important;}
           body #${VIEW} .${UI}-empty{display:flex!important;visibility:visible!important;}
           body #${VIEW} .${UI}-empty-copy,
           body #${VIEW} .${UI}-empty-add{display:flex!important;visibility:visible!important;}
          }'''
          if 'glueful-interviews-v6-width-patch' not in s:
              s = s.replace(marker, '/* glueful-interviews-v6-width-patch */\n'+patch, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/fix-interviews-layout.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add glueful-interviews-authoritative-v1.js .github/workflows/fix-interviews-layout.yml
          git commit -m 'Fix Interviews reference content width' || exit 0
          git push
