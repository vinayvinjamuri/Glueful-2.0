name: Repair index and refresh Resumes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore index from known-good Resumes baseline
        shell: bash
        run: |
          git checkout 9039e30212535ec6777cdbefe37c3621b92f7f81 -- index.html
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('./glueful-client-bootstrap-v1.js?v=154', './glueful-client-bootstrap-v1.js?v=155', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit repaired index
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Repair index and refresh Resumes bootstrap cache'
          git push
