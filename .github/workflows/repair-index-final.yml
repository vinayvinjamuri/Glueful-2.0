name: Repair Glueful index from known good baseline

on:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-repair-final
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore index from known good commit
        run: git checkout 86871434beb9f8b5be7a6ca633a80000b86db65e -- index.html

      - name: Apply Interviews loader fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('./glueful-client-bootstrap-v1.js?v=150', './glueful-client-bootstrap-v1.js?v=151', 1)
          marker = '<script src="./glueful-client-bootstrap-v1.js?v=151"></script>'
          if './glueful-interviews-authoritative-v1.js?v=5' not in s:
              s = s.replace(marker, marker + '\n  <script src="./glueful-interviews-authoritative-v1.js?v=5"></script>', 1)
          p.write_text(s)
          PY

      - name: Deploy corrected Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish corrected Pages site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit repaired index and remove repair workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/repair-index-final.yml
          git add index.html .github/workflows/repair-index-final.yml
          git commit -m "Restore full index from known good baseline" || exit 0
          git push
