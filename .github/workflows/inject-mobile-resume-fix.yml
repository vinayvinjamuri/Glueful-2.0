name: Inject mobile Resume Studio fix

on:
  push:
    branches: [fix/resume-studio-mobile-layout-logo]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject mobile runtime and bump cache
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path('index.html')
          sw = Path('sw.js')
          s = index.read_text(encoding='utf-8')
          marker = '<script src="./glueful-resume-studio-mobile-layout.js?v=20260819-4"></script>'
          if marker not in s:
              anchor = '<script src="./glueful-resume-studio-adobe.js?v=20260819-3"></script>'
              if anchor not in s:
                  anchor = '<script src="./glueful-resume-studio-adobe.js?v=20260819-2"></script>'
              if anchor not in s:
                  raise SystemExit('Adobe controller anchor not found')
              s = s.replace(anchor, anchor + '\n' + marker, 1)
          index.write_text(s, encoding='utf-8')

          w = sw.read_text(encoding='utf-8')
          w = w.replace('glueful-cache-v4-resume-adobe', 'glueful-cache-v5-resume-adobe')
          if './glueful-resume-studio-mobile-layout.js' not in w:
              w = w.replace('  "./glueful-resume-docx-forensics.js",', '  "./glueful-resume-docx-forensics.js",\n  "./glueful-resume-studio-mobile-layout.js",')
          sw.write_text(w, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo 'No runtime patch required.'
            exit 0
          fi
          git commit -m 'fix: enable mobile resume zoom and safe image recovery'
          git rm .github/workflows/inject-mobile-resume-fix.yml
          git commit -m 'chore: remove one-time mobile resume injection workflow'
          git push
