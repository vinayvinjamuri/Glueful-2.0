name: Force fresh Resume Studio runtime assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cache-bust:
    if: ${{ !contains(github.event.head_commit.message, '[resume-cache-busted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump Resume Studio asset versions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          s = index.read_text(encoding='utf-8')
          for old, new in [
              ('glueful-resume-docx-forensics.js?v=20260819-1', 'glueful-resume-docx-forensics.js?v=20260819-3'),
              ('glueful-resume-studio-supabase-bridge.js?v=20260819-1', 'glueful-resume-studio-supabase-bridge.js?v=20260819-3'),
              ('glueful-resume-studio-adobe.js?v=20260819-1', 'glueful-resume-studio-adobe.js?v=20260819-3'),
              ('glueful-resume-render-diagnostics.js?v=20260819-1', 'glueful-resume-render-diagnostics.js?v=20260819-3'),
          ]:
              s = s.replace(old, new)
          index.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          s = sw.read_text(encoding='utf-8')
          s = s.replace('glueful-cache-v3-resume-adobe', 'glueful-cache-v4-resume-adobe')
          s = s.replace('glueful-resume-docx-forensics.js?v=20260819-2', 'glueful-resume-docx-forensics.js?v=20260819-3')
          s = s.replace('glueful-resume-studio-adobe.js?v=20260819-2', 'glueful-resume-studio-adobe.js?v=20260819-3')
          sw.write_text(s, encoding='utf-8')
          PY

      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'fix: force fresh Resume Studio runtime assets [resume-cache-busted]'
          git rm .github/workflows/fix-resume-live-cache.yml
          git commit -m 'chore: remove one-time Resume Studio cache workflow [resume-cache-busted]'
          git push
