name: Gmail Mobile UI Regression

on:
  push:
    paths:
      - 'glueful-gmail-loader-v1.js'
      - 'glueful-gmail-integration-v1.js'
      - 'glueful-dashboard-approved-v1.js'
      - 'tests/gmail-mobile-regression.js'
      - '.github/workflows/gmail-mobile-regression.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'glueful-gmail-loader-v1.js'
      - 'glueful-gmail-integration-v1.js'
      - 'glueful-dashboard-approved-v1.js'
      - 'tests/gmail-mobile-regression.js'
      - 'sw.js'
      - '.github/workflows/gmail-mobile-regression.yml'

permissions:
  contents: read

jobs:
  gmail-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript syntax
        run: |
          set -e
          node --check glueful-gmail-loader-v1.js
          node --check glueful-gmail-integration-v1.js
          node --check glueful-dashboard-approved-v1.js
          node --check tests/gmail-mobile-regression.js
      - name: Gmail mobile overlay and runtime contract regression
        run: node tests/gmail-mobile-regression.js
