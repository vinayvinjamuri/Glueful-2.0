<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Continue — Glueful</title>
  <style>
    :root{
      --bg:#0B0E14;
      --card:#111620;
      --border:#252C38;
      --text:#F2F4F7;
      --muted:#8993A3;
      --grad:linear-gradient(135deg,#8B2CF5,#287BFF);
      --danger:#F27272;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    .card{
      width:100%;
      max-width:420px;
      padding:30px 28px;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:0 20px 60px rgba(0,0,0,.30);
      text-align:center;
    }
    .logo{
      width:48px;height:48px;margin:0 auto 18px;
      display:flex;align-items:center;justify-content:center;
      border-radius:12px;background:var(--grad);
      color:#fff;font-size:22px;font-weight:800;
    }
    h1{margin:0;font-size:27px}
    p{margin:10px 0 24px;color:var(--muted);font-size:14px;line-height:1.5}
    .btn{
      width:100%;height:48px;border:0;border-radius:10px;
      background:var(--grad);color:#fff;font-size:14px;font-weight:700;
      cursor:pointer;
    }
    .error{
      display:none;margin-top:18px;padding:11px 13px;border-radius:9px;
      color:var(--danger);background:rgba(242,114,114,.08);
      border:1px solid rgba(242,114,114,.18);
      font-size:13px;line-height:1.4;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">G</div>
    <h1>Continue to Glueful</h1>
    <p>Click the button below to continue securely to your password reset page.</p>
    <button id="continue" class="btn" type="button">Continue to reset password</button>
    <div id="error" class="error">
      This reset link is missing or invalid. Please request a new password reset email.
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const confirmationUrl = params.get("confirmation_url");
    const button = document.getElementById("continue");
    const error = document.getElementById("error");

    if (!confirmationUrl) {
      button.style.display = "none";
      error.style.display = "block";
    } else {
      button.addEventListener("click", () => {
        try {
          const url = new URL(confirmationUrl);

          // Only allow the Supabase Auth verification endpoint.
          if (
            url.protocol !== "https:" ||
            !url.hostname.endsWith(".supabase.co") ||
            url.pathname !== "/auth/v1/verify"
          ) {
            throw new Error("Invalid confirmation URL");
          }

          window.location.replace(url.toString());
        } catch (e) {
          console.error(e);
          button.style.display = "none";
          error.style.display = "block";
        }
      });
    }
  </script>
</body>
</html>
