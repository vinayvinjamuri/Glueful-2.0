<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Glueful</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#0B0E14;
  --card:#111620;
  --input:#0B0E14;
  --border:#252C38;
  --text:#F2F4F7;
  --muted:#8993A3;
  --grad:linear-gradient(135deg,#8B2CF5,#287BFF);
  --danger:#F27272;
  --success:#6EE7A8;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.card{
  width:100%;
  max-width:420px;
  padding:28px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:0 20px 60px rgba(0,0,0,.30);
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:24px;
}
.logo{
  width:40px;
  height:40px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  background:var(--grad);
  color:#fff;
  font-weight:800;
  font-size:20px;
}
.brand-name{font-size:18px;font-weight:700}
h1{margin:0;font-size:28px;line-height:1.2}
.sub{
  margin:8px 0 24px;
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
}
.field{margin-bottom:18px}
label{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  font-weight:500;
}
.wrap{position:relative}
input{
  width:100%;
  height:48px;
  padding:0 46px 0 14px;
  border:1px solid var(--border);
  border-radius:10px;
  outline:none;
  background:var(--input);
  color:var(--text);
  font-size:15px;
}
input:focus{
  border-color:#4C67FF;
  box-shadow:0 0 0 3px rgba(76,103,255,.12);
}
.toggle{
  position:absolute;
  right:7px;
  top:50%;
  transform:translateY(-50%);
  width:34px;
  height:34px;
  border:0;
  border-radius:7px;
  background:transparent;
  color:#AEB7C2;
  cursor:pointer;
  font-size:17px;
}
.hint{margin-top:7px;color:var(--muted);font-size:11px}
.btn{
  width:100%;
  height:48px;
  border:0;
  border-radius:10px;
  background:var(--grad);
  color:#fff;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}
.btn:disabled{opacity:.65;cursor:not-allowed}
.back{
  width:100%;
  margin-top:14px;
  padding:10px;
  border:0;
  background:transparent;
  color:#A47BFF;
  font-size:13px;
  cursor:pointer;
}
.msg{
  display:none;
  margin:0 0 18px;
  padding:11px 13px;
  border-radius:9px;
  font-size:13px;
  line-height:1.4;
}
.msg.error{
  display:block;
  color:var(--danger);
  background:rgba(242,114,114,.08);
  border:1px solid rgba(242,114,114,.18);
}
.msg.success{
  display:block;
  color:var(--success);
  background:rgba(110,231,168,.08);
  border:1px solid rgba(110,231,168,.18);
}
#loading{
  text-align:center;
  color:var(--muted);
  font-size:13px;
}
.success{display:none;text-align:center}
.success-icon{
  width:52px;
  height:52px;
  margin:0 auto 16px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(110,231,168,.10);
  color:var(--success);
  font-size:25px;
}
.success p{
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
}
</style>
</head>

<body>

<main class="card">

  <div class="brand">
    <div class="logo">G</div>
    <div class="brand-name">Glueful</div>
  </div>

  <section id="loading">
    Verifying your password reset link...
  </section>

  <section id="reset" style="display:none">

    <h1>Reset your password</h1>

    <p class="sub">
      Choose a new password for your Glueful account.
    </p>

    <div id="msg" class="msg" role="alert" aria-live="polite"></div>

    <form id="form">

      <div class="field">

        <label for="password">New password</label>

        <div class="wrap">

          <input
            id="password"
            type="password"
            autocomplete="new-password"
            minlength="6"
            placeholder="Enter new password"
            required
          >

          <button
            class="toggle"
            type="button"
            data-target="password"
            aria-label="Show password"
          >👁</button>

        </div>

        <div class="hint">
          Use at least 6 characters.
        </div>

      </div>

      <div class="field">

        <label for="confirm">Confirm password</label>

        <div class="wrap">

          <input
            id="confirm"
            type="password"
            autocomplete="new-password"
            minlength="6"
            placeholder="Confirm new password"
            required
          >

          <button
            class="toggle"
            type="button"
            data-target="confirm"
            aria-label="Show password"
          >👁</button>

        </div>

      </div>

      <button
        id="update"
        class="btn"
        type="submit"
      >
        Update password
      </button>

    </form>

    <button
      class="back"
      type="button"
      onclick="goLogin()"
    >
      Back to Glueful
    </button>

  </section>

  <section id="success" class="success">

    <div class="success-icon">✓</div>

    <h1>Password updated</h1>

    <p>
      Your password has been changed successfully.
      You can now sign in to Glueful with your new password.
    </p>

    <button
      class="btn"
      type="button"
      onclick="goLogin()"
    >
      Sign in to Glueful
    </button>

  </section>

</main>

<script>

const SUPABASE_URL =
  "https://xztbhheexianejwvpwa.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_91SKh77UlMjhwIcTimKyAg_Nbb_uVIN";

const GLUEFUL_APP_URL =
  "https://vinayvinjamuri.github.io/Glueful-2.0/";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );


const loading =
  document.getElementById("loading");

const reset =
  document.getElementById("reset");

const success =
  document.getElementById("success");

const msg =
  document.getElementById("msg");

const form =
  document.getElementById("form");

const update =
  document.getElementById("update");


function showMessage(text,type="error"){

  msg.textContent = text || "";

  msg.className =
    "msg " + type;

}


function showReset(){

  loading.style.display = "none";

  reset.style.display = "block";

  success.style.display = "none";

}


function showSuccess(){

  loading.style.display = "none";

  reset.style.display = "none";

  success.style.display = "block";

}


function showInvalid(){

  loading.style.display = "none";

  reset.style.display = "block";

  form.style.display = "none";

  showMessage(
    "This password reset link is invalid or has expired. Please request a new reset email.",
    "error"
  );

}


function goLogin(){

  window.location.href =
    GLUEFUL_APP_URL;

}


/*
 * Password visibility buttons.
 */
document
  .querySelectorAll(".toggle")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        const input =
          document.getElementById(
            button.dataset.target
          );

        const isVisible =
          input.type === "text";

        input.type =
          isVisible
            ? "password"
            : "text";

        button.setAttribute(
          "aria-label",
          isVisible
            ? "Show password"
            : "Hide password"
        );

      }
    );

  });


/*
 * Actual password update.
 */
form.addEventListener(
  "submit",
  async event => {

    event.preventDefault();

    const password =
      document.getElementById(
        "password"
      ).value;

    const confirm =
      document.getElementById(
        "confirm"
      ).value;


    if(password.length < 6){

      showMessage(
        "Password must be at least 6 characters."
      );

      return;

    }


    if(password !== confirm){

      showMessage(
        "Passwords do not match."
      );

      return;

    }


    update.disabled = true;

    update.textContent =
      "Updating password...";


    try{

      const { error } =
        await supabaseClient.auth
          .updateUser({
            password:password
          });


      if(error){

        console.error(
          "Password update error:",
          error
        );

        showMessage(
          error.message ||
          "Unable to update your password. Please request a new reset link."
        );

        update.disabled = false;

        update.textContent =
          "Update password";

        return;

      }


      showSuccess();

      /*
       * The password has already been changed.
       * Sign out after a short delay so the success
       * screen can remain visible.
       */
      setTimeout(
        async () => {

          await supabaseClient.auth
            .signOut();

        },
        300
      );


    }catch(error){

      console.error(
        "Password update exception:",
        error
      );

      showMessage(
        "Unable to update your password. Please try again."
      );

      update.disabled = false;

      update.textContent =
        "Update password";

    }

  }
);


/*
 * IMPORTANT:
 *
 * Register the auth-state listener BEFORE trying to
 * read the session. This prevents the recovery event
 * from being missed while Supabase processes the
 * #access_token URL.
 */
let recoveryDetected = false;

const {
  data: authListener
} =
  supabaseClient.auth
    .onAuthStateChange(
      (event, session) => {

        console.log(
          "Glueful auth event:",
          event
        );


        if(
          event ===
            "PASSWORD_RECOVERY" &&
          session
        ){

          recoveryDetected =
            true;

          showReset();

        }

      }
    );


/*
 * Process the recovery URL.
 *
 * Supabase normally handles the hash automatically.
 * The explicit setSession fallback below makes the
 * page more reliable on GitHub Pages when the initial
 * URL processing happens after the first getSession().
 */
async function initializeRecovery(){

  try{

    const hash =
      window.location.hash;


    if(hash){

      const params =
        new URLSearchParams(
          hash.substring(1)
        );

      const accessToken =
        params.get(
          "access_token"
        );

      const refreshToken =
        params.get(
          "refresh_token"
        );

      const type =
        params.get(
          "type"
        );


      if(
        accessToken &&
        refreshToken &&
        type === "recovery"
      ){

        const { data, error } =
          await supabaseClient.auth
            .setSession({
              access_token:
                accessToken,
              refresh_token:
                refreshToken
            });


        if(!error && data?.session){

          recoveryDetected =
            true;

          showReset();

          return;

        }

        if(error){

          console.error(
            "Recovery setSession error:",
            error
          );

        }

      }

    }


    /*
     * Give Supabase time to finish processing the
     * recovery URL and fire PASSWORD_RECOVERY.
     */
    const {
      data,
      error
    } =
      await supabaseClient.auth
        .getSession();


    if(error){

      console.error(
        "Recovery getSession error:",
        error
      );

      showInvalid();

      return;

    }


    if(data?.session){

      recoveryDetected =
        true;

      showReset();

      return;

    }


    /*
     * Do not immediately declare the link invalid.
     * GitHub Pages can load before the Supabase
     * recovery session has finished initializing.
     */
    setTimeout(
      async () => {

        if(recoveryDetected){

          return;

        }


        const {
          data:finalData
        } =
          await supabaseClient.auth
            .getSession();


        if(finalData?.session){

          recoveryDetected =
            true;

          showReset();

          return;

        }


        showInvalid();

      },
      5000
    );

  }catch(error){

    console.error(
      "Recovery initialization error:",
      error
    );

    showInvalid();

  }

}


initializeRecovery();


/*
 * Clean up the listener when the page is unloaded.
 */
window.addEventListener(
  "beforeunload",
  () => {

    authListener
      ?.subscription
      ?.unsubscribe();

  }
);

</script>

</body>
</html>
