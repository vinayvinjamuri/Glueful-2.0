<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Glueful</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0B0E14;--card:#111620;--input:#0B0E14;--border:#252C38;--text:#F2F4F7;--muted:#8993A3;--grad:linear-gradient(135deg,#8B2CF5,#287BFF);--danger:#F27272;--success:#6EE7A8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.card{width:100%;max-width:420px;padding:28px;background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:24px}.logo{width:40px;height:40px;border-radius:10px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
h1{margin:0;font-size:28px;line-height:1.2}.sub{margin:8px 0 24px;color:var(--muted);font-size:14px;line-height:1.5}
.field{margin-bottom:18px}label{display:block;margin-bottom:7px;font-size:13px;font-weight:500}
.wrap{position:relative}input{width:100%;height:48px;padding:0 46px 0 14px;border:1px solid var(--border);border-radius:10px;outline:none;background:var(--input);color:var(--text);font-size:15px}
input:focus{border-color:#4C67FF;box-shadow:0 0 0 3px rgba(76,103,255,.12)}.toggle{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:7px;background:transparent;color:#AEB7C2;cursor:pointer;font-size:17px}
.hint{margin-top:7px;color:var(--muted);font-size:11px}.btn{width:100%;height:48px;border:0;border-radius:10px;background:var(--grad);color:#fff;font-size:14px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.65;cursor:not-allowed}
.back{width:100%;margin-top:14px;padding:10px;border:0;background:transparent;color:#A47BFF;font-size:13px;cursor:pointer}
.msg{display:none;margin:0 0 18px;padding:11px 13px;border-radius:9px;font-size:13px;line-height:1.4}.msg.error{display:block;color:var(--danger);background:rgba(242,114,114,.08);border:1px solid rgba(242,114,114,.18)}
.success{display:none;text-align:center}.success-icon{width:52px;height:52px;margin:0 auto 16px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(110,231,168,.1);color:var(--success);font-size:25px}.success p{color:var(--muted);font-size:14px;line-height:1.5}
#loading{text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main class="card">
  <div class="brand"><div class="logo">G</div><strong>Glueful</strong></div>

  <section id="loading"><div>Verifying your password reset link...</div></section>

  <section id="reset" style="display:none">
    <h1>Reset your password</h1>
    <p class="sub">Choose a new password for your Glueful account.</p>
    <div id="msg" class="msg" role="alert" aria-live="polite"></div>

    <form id="form">
      <div class="field">
        <label for="password">New password</label>
        <div class="wrap">
          <input id="password" type="password" autocomplete="new-password" minlength="6" placeholder="Enter new password" required>
          <button class="toggle" type="button" data-target="password" aria-label="Show password">👁</button>
        </div>
        <div class="hint">Use at least 6 characters.</div>
      </div>

      <div class="field">
        <label for="confirm">Confirm password</label>
        <div class="wrap">
          <input id="confirm" type="password" autocomplete="new-password" minlength="6" placeholder="Confirm new password" required>
          <button class="toggle" type="button" data-target="confirm" aria-label="Show password">👁</button>
        </div>
      </div>

      <button id="update" class="btn" type="submit">Update password</button>
    </form>

    <button class="back" type="button" onclick="goLogin()">Back to Glueful</button>
  </section>

  <section id="success" class="success">
    <div class="success-icon">✓</div>
    <h1>Password updated</h1>
    <p>Your password has been changed successfully. You can now sign in to Glueful with your new password.</p>
    <button class="btn" type="button" onclick="goLogin()">Sign in to Glueful</button>
  </section>
</main>

<script>
const SUPABASE_URL="https://xztbhheexianejwvpwa.supabase.co";
const SUPABASE_KEY="sb_publishable_91SKh77UlMjhwIcTimKyAg_Nbb_uVIN";
const GLUEFUL_APP_URL="https://vinayvinjamuri.github.io/Glueful-2.0/";

const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
  auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
});

const loading=document.getElementById("loading");
const reset=document.getElementById("reset");
const success=document.getElementById("success");
const msg=document.getElementById("msg");
const form=document.getElementById("form");
const update=document.getElementById("update");

function showMessage(text){
  msg.textContent=text||"";
  msg.className="msg error";
}
function showReset(){
  loading.style.display="none";
  reset.style.display="block";
  success.style.display="none";
}
function showSuccess(){
  loading.style.display="none";
  reset.style.display="none";
  success.style.display="block";
}
function showInvalid(){
  loading.style.display="none";
  reset.style.display="block";
  form.style.display="none";
  showMessage("This password reset link is invalid or has expired. Please request a new reset email.");
}
function goLogin(){window.location.href=GLUEFUL_APP_URL;}

document.querySelectorAll(".toggle").forEach(button=>{
  button.addEventListener("click",()=>{
    const input=document.getElementById(button.dataset.target);
    const visible=input.type==="text";
    input.type=visible?"password":"text";
    button.setAttribute("aria-label",visible?"Show password":"Hide password");
  });
});

form.addEventListener("submit",async event=>{
  event.preventDefault();

  const password=document.getElementById("password").value;
  const confirm=document.getElementById("confirm").value;

  if(password.length<6){
    showMessage("Password must be at least 6 characters.");
    return;
  }

  if(password!==confirm){
    showMessage("Passwords do not match.");
    return;
  }

  update.disabled=true;
  update.textContent="Updating password...";

  try{
    const {error}=await supabaseClient.auth.updateUser({password});

    if(error){
      console.error("Password update error:",error);
      showMessage(error.message||"Unable to update your password. Please request a new reset link.");
      update.disabled=false;
      update.textContent="Update password";
      return;
    }

    showSuccess();

    setTimeout(async()=>{
      await supabaseClient.auth.signOut();
    },100);

  }catch(error){
    console.error("Password update exception:",error);
    showMessage("Unable to update your password. Please try again.");
    update.disabled=false;
    update.textContent="Update password";
  }
});

async function initialize(){
  const {data,error}=await supabaseClient.auth.getSession();

  if(error){
    console.error("Recovery session error:",error);
    showInvalid();
    return;
  }

  if(data?.session){
    showReset();
    return;
  }

  let recovered=false;

  const {data:listener}=supabaseClient.auth.onAuthStateChange((event,session)=>{
    if(event==="PASSWORD_RECOVERY"&&session){
      recovered=true;
      showReset();
    }
  });

  setTimeout(()=>{
    listener?.subscription?.unsubscribe();
    if(!recovered) showInvalid();
  },2000);
}

initialize();
</script>
</body>
</html>
